# verify: eng/verify.sh on a self-hosted macOS runner, as a pull-request check and as the merge-queue
# check. eng/verify.sh is this repository's gate, and before this workflow it had never run in any
# automation: packages.yml runs four of the React lane's steps on ubuntu and nothing else. Shape copied from harborline-api's verify.yml
# (control: docs/velocity/landing.md).
#
# Fork safety: harborline-app is public and the shared lane runs on our own machines. It runs only
# for pull requests whose head lives in this repository, and for merge-queue groups (which are built
# from already-reviewed heads). A fork PR gets the hosted checks only.
#
# T-660 (the shape T-633 landed in harborline-api): `verify` is the required context, and it is an
# aggregator with no condition. GitHub counts a job skipped by its own `if` as a SUCCESSFUL required
# check, so a required job that carries `vars.ACTIONS_ENABLED == 'true'` turns green the moment the
# variable is deleted. The lane keeps the switch (it costs self-hosted machine time); the context
# cannot be skipped and is green only when the lane it stands for ran and passed.
#
# Owner decision 2026-09-25: a draft PR no longer starts the self-hosted verify-shared lane. Drafts
# were queuing behind the merge-queue's own runs on macpro, delaying every ready-for-review PR behind
# work nobody had asked to be checked yet. Marking a PR ready for review (or opening it non-draft)
# now triggers the full run; the `verify` aggregator stays unconditional and required (T-633/T-660) so
# a draft's skipped lane reports a failure with an explicit message, not a false-green required check.
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-shared:
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    runs-on: [self-hosted, macOS, ARM64, macpro]
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Runner
        shell: bash
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      # No setup-node / setup-dotnet here, deliberately: the runner's PATH carries the host toolchain
      # the Mac gates were measured with, and global.json pins the SDK. Printing the versions makes a
      # host-versus-host disagreement attributable instead of a mystery.
      - name: Host toolchain
        run: |
          for tool in node npm dotnet git jq; do
            printf '%-8s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          node -v; npm -v; dotnet --version

      # Both lanes consume the platform as a PACKAGE from a local feed built out of a sibling platform
      # checkout, and both .feed directories are gitignored — so eng/verify.sh refuses up front on a
      # clean tree. The pin is checked out here rather than reused from a host-local lanes/ directory
      # on purpose: harborline-api's verify job already rewrites lanes/platform-pin to ITS pin, and
      # two jobs sharing that directory on one Mac would clobber each other.
      - name: Read the recorded platform pin
        id: platform_pin
        run: echo "commit=$(jq -r '.commit' eng/platform-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned platform
        uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-platform
          ref: ${{ steps.platform_pin.outputs.commit }}
          path: .platform

      - name: Fail loudly when the checkout drifts from the recorded pin
        run: |
          pinned="$(jq -r '.commit' eng/platform-pin.json)"
          actual="$(git -C .platform rev-parse HEAD)"
          if [ "$pinned" != "$actual" ]; then
            echo "eng/platform-pin.json records $pinned but the checkout is $actual." >&2
            echo "The checkout ref is derived from the pin file; a mismatch means the checkout step changed." >&2
            exit 1
          fi
          echo "platform pinned at $actual"

      # The dependency-ledger step reads every pin's justification note from the control repository
      # (ADR-0086). Private, so the checkout carries the pins token the api's hosted job uses.
      - name: Check out harborline-control for the dependency ledger
        uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-control
          ref: main
          path: .control
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - name: Build the React local package feed
        working-directory: apps/react
        env:
          HARBORLINE_PLATFORM_REPO: ${{ github.workspace }}/.platform
        run: npm run feed

      - name: Build the Blazor local package feed
        working-directory: apps/blazor
        env:
          HARBORLINE_PLATFORM_REPO: ${{ github.workspace }}/.platform
        run: node scripts/build-local-feed.mjs

      # The whole gate, in the order the receipt records: boundaries, the three React lane steps,
      # dotnet-test, packages, host-manifest. On success it writes
      # .git/harborline-app-verify-receipt.json, which is the evidence uploaded below.
      - name: Keep the pinned checkout out of the attested tree
        # verify.sh refuses to record a receipt from a dirty tree; .platform is a checkout, not a change.
        run: |
          grep -qx '.platform/' .git/info/exclude 2>/dev/null || echo '.platform/' >> .git/info/exclude
          grep -qx '.control/' .git/info/exclude 2>/dev/null || echo '.control/' >> .git/info/exclude
          git status --porcelain

      - name: eng/verify.sh
        env:
          HARBORLINE_CONTROL_REPO: ${{ github.workspace }}/.control
        run: bash eng/verify.sh

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-app-verify-receipt.json
            apps/react/.feed/packed-version.props
            apps/blazor/.feed/packed-version.props

  # T-720: StrykerJS on the JS/TS packages whose source this PR changes. Advisory: it is not in
  # `verify`'s needs. eng/strykerjs.mjs refuses a run that tested zero mutants (Stryker exits 0 on
  # one), skips a PR that changed no mutable source, and the json report is uploaded either way.
  strykerjs:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The React app consumes the platform as a packed local feed built from the recorded pin,
      # exactly as verify-shared builds it.
      - name: Read the recorded platform pin
        id: platform_pin
        run: echo "commit=$(jq -r '.commit' eng/platform-pin.json)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned platform
        uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-platform
          ref: ${{ steps.platform_pin.outputs.commit }}
          path: .platform
      - name: Build the React local package feed and install
        working-directory: apps/react
        env:
          HARBORLINE_PLATFORM_REPO: ${{ github.workspace }}/.platform
        run: |
          npm run feed
          pnpm install --frozen-lockfile
      - name: StrykerJS self-test and inventory
        run: |
          node --test eng/tests/strykerjs.test.mjs
          node eng/strykerjs.mjs check
      - name: StrykerJS on changed source
        run: node eng/strykerjs.mjs run --base origin/main
      - name: Mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strykerjs-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: '**/reports/mutation/mutation.json'

  verify:
    # T-660: the required context. Deliberately unconditional (`always()`), so neither the kill
    # switch nor a fork head nor a failed dependency can leave it skipped-and-therefore-green. It
    # passes only when every job in `needs` reports success; a skipped lane fails it.
    needs: [verify-shared]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every lane this context stands for ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "::error::draft PR: self-hosted lanes are not run; mark ready for review to verify"
            exit 1
          fi
          echo "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" >/dev/null || { echo "::error::a lane the verify context stands for did not succeed"; exit 1; }
