# stryker: Stryker.NET mutation testing (control PROC-0002, "Mutation evidence as an artefact").
#
# Owner ruling Q43: a pull request run is review feedback. It mutates the changed .NET source, lists the
# surviving and uncovered mutants on the changed lines in the job summary, uploads the json report, and
# never compares against a project's break floor. The nightly full run on main (07:20 UTC)
# mutates everything and enforces each project's break, which starts at eng/stryker-baselines.json.
#
# Advisory. It is not in the `verify` aggregator's needs and is not a required check, so a red run
# here never blocks a merge; it is the evidence a reviewer reads.
#
# eng/stryker.mjs does the work: it checks every test project has a stryker-config.json or an entry in
# eng/stryker-exclusions.json, runs Stryker for each configured project whose source changed, and fails
# when the json report shows 0 mutants tested. Stryker's own exit code is 0 when it mutated nothing
# (control T-720), so the report is the evidence, not the exit code. No source change: skipped, green.
#
# winbox, not the Macs: macpro carries the merge queue's verify-shared lane and mac16 is the
# perf-quiet runner (T-724 ruling 8). Fork and draft guards are verify-shared's, character for
# character: a fork pull request never runs its author's code on our machine, and a draft waits.
#
# T-724 ruling 118 (Q50): the pull_request path moved to a standard GitHub-hosted ubuntu-latest
# runner. eng/stryker.mjs's msbuild-path fallback is gated to process.platform === 'win32', and the
# platform feed build below has no Windows-specific path, so nothing in the PR run is Windows-only.
# The schedule/workflow_dispatch (main) path stays on winbox exactly as before.
name: stryker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('stryker-pr-{0}', github.event.pull_request.number) || format('stryker-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workload-route:
    if: vars.ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.route.outputs.enabled }}
      labels: ${{ steps.route.outputs.labels }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Explain background routing
        id: route
        env:
          BACKGROUND_MUTATION_ROUTE: ${{ vars.BACKGROUND_MUTATION_ROUTE }}
          LOCAL_BACKGROUND_RESERVATION: ${{ vars.LOCAL_BACKGROUND_RESERVATION }}
        run: |
          node --test .github/workloads/workload-route.test.mjs
          python3 .github/workloads/host-workload-lock.test.py
          node .github/workloads/workload-route.mjs
  stryker:
    needs: workload-route
    if: >-
      vars.ACTIONS_ENABLED == 'true' && needs.workload-route.outputs.enabled == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    runs-on: ${{ fromJSON(needs.workload-route.outputs.labels) }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 90 }}
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Git Bash on PATH for the service account
        # winbox's machine PATH has Git\cmd; Bash and its utilities live in these directories.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'

      # fetch-depth 0 so refs/remotes/origin/main exists: the configs' since target and the script's
      # changed-source test both diff against it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      # Provision the pinned toolchain on every route; qualification does not rely on machine PATH.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # ReferenceHost restores the platform's UI packages from the gitignored local feed, built from
      # the pinned platform checkout exactly as verify-shared builds it.
      - name: Read the recorded platform pin
        id: platform_pin
        run: echo "commit=$(node -p "require('./eng/platform-pin.json').commit")" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned platform
        uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-platform
          ref: ${{ steps.platform_pin.outputs.commit }}
          path: .platform

      - name: Hosted PR mutation
        if: github.event_name == 'pull_request'
        env:
          HARBORLINE_PLATFORM_REPO: ${{ github.workspace }}/.platform
        run: |
          (cd apps/blazor && node scripts/build-local-feed.mjs)
          dotnet tool restore
          node eng/stryker.mjs run
      - name: Reserved full mutation and isolated feed
        if: github.event_name != 'pull_request'
        env:
          HARBORLINE_PLATFORM_REPO: ${{ github.workspace }}/.platform
          NUGET_PACKAGES: ${{ runner.temp }}/mutation-nuget-${{ github.run_id }}-${{ github.run_attempt }}
        run: python .github/workloads/host-workload-lock.py -- bash .github/workloads/full-mutation.sh

      - name: Mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          path: StrykerOutput/*/reports/mutation-report.json
