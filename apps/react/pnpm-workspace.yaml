packages:
  - .
# Hoisted layout, as npm laid it out: the feed tarball for ui-react peers on the one react copy here;
# the isolated layout gave it a second React and broke the hook-based components under test.
nodeLinker: hoisted
# pnpm 11 checks every lockfile entry against the registry for minimum release age; the two
# @harborline-software packages come from the local .feed and are not on the registry.
minimumReleaseAgeExclude:
  - "@harborline-software/*"
# StrykerJS 10.0.0 false survivors, patched until upstream releases the fixes. core: a static mutant (a module-level
# constant) was activated after import whenever testFiles is set, so tests never saw it (stryker-js#6144, fix PR #6145).
# vitest-runner: a mutant that makes a test file fail to load was reported Survived with zero tests (#6150, fix PR #6217).
# Drop each patch when a release contains its fix; pnpm refuses the install if a patch no longer applies.
patchedDependencies:
  '@stryker-mutator/core@10.0.0': patches/@stryker-mutator__core@10.0.0.patch
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
